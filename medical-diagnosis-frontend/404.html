<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page Not Found — MediDiagnose" />
  <title>404 — MediDiagnose</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: '';
      position: absolute;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(37,99,235,.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .error-illustration {
      font-size: clamp(5rem, 15vw, 10rem);
      line-height: 1;
      margin-bottom: 1.5rem;
      animation: bounceIn .6s ease;
    }
    .error-code {
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 900;
      font-family: var(--font-display);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: .75rem;
      animation: fadeIn .5s ease .2s both;
    }
    .error-title {
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: .75rem;
      animation: slideUp .5s ease .3s both;
    }
    .error-desc {
      max-width: 420px;
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      line-height: 1.7;
      animation: slideUp .5s ease .4s both;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: slideUp .5s ease .5s both;
    }
    .error-nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }
    .floating-shapes .shape {
      position: absolute;
      border-radius: 50%;
      opacity: .06;
      background: var(--primary);
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }
  </style>
</head>
<body>
  <nav class="error-nav">
    <a href="index.html" style="display:flex;align-items:center;gap:.6rem;text-decoration:none">
      <div style="width:34px;height:34px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.95rem;color:#fff">🏥</div>
      <span style="font-family:var(--font-display);font-size:1rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent">MediDiagnose</span>
    </a>
    <div style="display:flex;gap:.5rem;align-items:center">
      <button class="dark-toggle btn" data-theme-toggle><span data-theme-icon>🌙</span></button>
      <a href="login.html" class="btn btn-primary btn-sm">Sign In</a>
    </div>
  </nav>

  <div class="error-page" style="padding-top:70px">
    <!-- Floating shapes -->
    <div class="floating-shapes" aria-hidden="true">
      <div class="shape" style="width:300px;height:300px;top:-50px;left:-100px;animation-delay:0s"></div>
      <div class="shape" style="width:200px;height:200px;bottom:50px;right:-50px;animation-delay:1s;background:var(--success)"></div>
      <div class="shape" style="width:150px;height:150px;bottom:100px;left:100px;animation-delay:2s;background:var(--warning)"></div>
    </div>

    <div class="error-illustration">🏥</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      Oops! It seems this medical record has gone missing from our system.
      The page you're looking for doesn't exist or may have been moved.
    </p>
    <div class="error-actions">
      <a href="patient-dashboard.html" class="btn btn-primary btn-lg">
        🏠 Back to Dashboard
      </a>
      <a href="index.html" class="btn btn-outline btn-lg">
        🏥 Go to Homepage
      </a>
    </div>

    <!-- Helpful links -->
    <div style="margin-top:3rem;display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center">
      <a href="patient-dashboard.html" style="color:var(--primary);font-size:.875rem;font-weight:500">Patient Dashboard</a>
      <a href="doctor-dashboard.html"  style="color:var(--primary);font-size:.875rem;font-weight:500">Doctor Portal</a>
      <a href="diagnosis-chat.html"    style="color:var(--primary);font-size:.875rem;font-weight:500">AI Chat</a>
      <a href="upload-report.html"     style="color:var(--primary);font-size:.875rem;font-weight:500">Upload Report</a>
      <a href="login.html"             style="color:var(--primary);font-size:.875rem;font-weight:500">Sign In</a>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="js/app.js"></script>
</body>
</html>
