<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Patient Search — MediDiagnose Doctor Portal" />
  <title>Patient Search — MediDiagnose</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <a href="doctor-dashboard.html" class="sidebar-brand">
      <div class="sidebar-logo">🏥</div>
      <span class="sidebar-brand-name">MediDiagnose</span>
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-label">Doctor Portal</div>
        <a href="doctor-dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="patient-search.html"   class="nav-link active"><span class="nav-icon">🔍</span> Search Patients</a>
        <a href="patient-history.html"  class="nav-link"><span class="nav-icon">📋</span> Patient Records</a>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">Account</div>
        <a href="profile.html"  class="nav-link"><span class="nav-icon">👤</span> Profile</a>
        <a href="settings.html" class="nav-link"><span class="nav-icon">⚙️</span> Settings</a>
        <a href="login.html"    class="nav-link" style="color:var(--danger)"><span class="nav-icon">🚪</span> Logout</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar-placeholder md" style="background:linear-gradient(135deg,#10b981,#059669)">SC</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Dr. Sarah Chen</div>
          <div class="sidebar-user-role">Doctor</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle btn" data-sidebar-toggle>☰</button>
        <span class="topbar-page-title">Search Patients</span>
      </div>
      <div class="topbar-right">
        <button class="notif-btn btn">🔔<span class="notif-dot"></span></button>
        <button class="dark-toggle btn" data-theme-toggle><span data-theme-icon>🌙</span></button>
        <a href="profile.html"><div class="avatar-placeholder sm" style="background:linear-gradient(135deg,#10b981,#059669)">SC</div></a>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="doctor-dashboard.html">Doctor Portal</a><span>›</span><span>Patient Search</span>
        </div>
        <h1 class="page-title">🔍 Search Patients</h1>
        <p class="page-subtitle">Find and review patient medical histories and diagnoses</p>
      </div>

      <!-- Search Card -->
      <div class="card card-body" style="margin-bottom:1.5rem">
        <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:1;min-width:200px">
            <label class="form-label">🔍 Search</label>
            <div class="input-wrapper">
              <span class="input-icon">🔍</span>
              <input type="text" class="form-control" id="patientSearch" placeholder="Name, email, or username…" />
            </div>
          </div>
          <div>
            <label class="form-label">Status Filter</label>
            <select class="form-control filter-select" id="filterStatus">
              <option value="">All Patients</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <div>
            <label class="form-label">Date Range</label>
            <input type="date" class="form-control" />
          </div>
          <button class="btn btn-primary" onclick="Toast.info('Filters applied')">Apply Filters</button>
          <button class="btn btn-ghost" onclick="document.getElementById('patientSearch').value='';document.getElementById('filterStatus').value=''">Reset</button>
        </div>
      </div>

      <!-- Results header -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div style="font-size:.875rem;color:var(--text-muted)">Showing <strong style="color:var(--text)" id="resultCount">8</strong> patients</div>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-ghost btn-sm" onclick="Toast.info('Exported patient list')">📥 Export</button>
        </div>
      </div>

      <!-- Patient Cards Grid -->
      <div class="patient-cards-grid" id="patientGrid">
        <!-- Populated by JS -->
      </div>

      <!-- Pagination -->
      <div style="display:flex;justify-content:center;margin-top:1.5rem">
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </main>
</div>

<div id="toastContainer" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
